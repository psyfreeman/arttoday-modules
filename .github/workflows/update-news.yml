name: Update Art News

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install rss-parser

      - name: Fetch news
        run: node scripts/update-news.js

      - name: Commit and push
        run: |
          git config user.name "ArtToday Bot"
          git config user.email "bot@arttoday.local"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news.json"
          git push
