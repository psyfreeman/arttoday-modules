name: Update Art News

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 по Москве (06:00 UTC)
    - cron: "0 12 * * *"  # 15:00 по Москве (12:00 UTC)
    - cron: "0 18 * * *"  # 21:00 по Москве (18:00 UTC)
  workflow_dispatch:      # ручной запуск тоже остаётся

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install rss-parser

      - name: Fetch news
        run: node scripts/update-news.js

      - name: Commit and push
        run: |
          git config user.name "ArtToday Bot"
          git config user.email "bot@arttoday.local"
          git add news.json
          git status
          if git diff --staged --quiet; then
            echo "No changes in news.json"
          else
            git commit -m "Update news.json"
            git push origin HEAD:main
            echo "news.json pushed"
          fi
